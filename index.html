<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#0b0f14"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <title>My App</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {

            width: 100%;
            height: 100%;

        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0b0f14;

            color: #ffffff;

            overflow: hidden;

            -webkit-font-smoothing: antialiased;

        }


        /* =========================================
           APP
        ========================================= */

        .app {

            width: 100%;
            height: 100vh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #26313c 0%,
                    #151c24 38%,
                    #0b0f14 78%
                );

        }


        /* =========================================
           SCREEN
        ========================================= */

        .screen {

            width: 100%;
            height: 100%;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

        }


        .screen.active {

            display: flex;

        }


        /* =========================================
           LOGIN
        ========================================= */

        .login-box {

            width: 100%;
            max-width: 380px;

            text-align: center;

        }


        .app-title {

            font-size: 32px;

            font-weight: 700;

            line-height: 1.2;

            margin-bottom: 10px;

            color: #ffffff;

        }


        .app-subtitle {

            font-size: 14px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.55
                );

            margin-bottom: 32px;

        }


        /* =========================================
           INPUT
        ========================================= */

        .input-box {

            width: 100%;

            margin-bottom: 14px;

        }


        .input-box input {

            width: 100%;

            height: 54px;

            padding:
                0 17px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            border-radius: 14px;

            outline: none;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.07
                );

            color: #ffffff;

            font-size: 15px;

            transition:
                0.2s;

        }


        .input-box input::placeholder {

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.42
                );

        }


        .input-box input:focus {

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-button {

            width: 100%;

            height: 54px;

            margin-top: 5px;

            border: none;

            border-radius: 14px;

            background: #ffffff;

            color: #111111;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s,
                opacity 0.15s;

        }


        .login-button:active {

            transform: scale(0.98);

        }


        .login-button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

        }


        /* =========================================
           ERROR
        ========================================= */

        .error-message {

            min-height: 22px;

            margin-top: 15px;

            color: #ff7070;

            font-size: 13px;

            line-height: 1.4;

        }


        /* =========================================
           MAIN PAGE
        ========================================= */

        .main-content {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

        }


        /* =========================================
           PROFILE IMAGE
        ========================================= */

        .profile-image {

            width: 150px;

            height: 150px;

            display: block;

            object-fit: cover;

            border-radius: 50%;

            background: #202832;

            border:
                4px solid
                #ffffff;

            box-shadow:

                0 0 0 8px
                rgba(
                    255,
                    255,
                    255,
                    0.06
                ),

                0 20px 55px
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );

        }


        /* =========================================
           NAME
        ========================================= */

        .profile-name {

            margin-top: 22px;

            font-size: 25px;

            font-weight: 600;

            line-height: 1.3;

            color: #ffffff;

            letter-spacing: 0.3px;

        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;

            justify-content: center;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );

            backdrop-filter:
                blur(5px);

            -webkit-backdrop-filter:
                blur(5px);

        }


        .loading.active {

            display: flex;

        }


        /* =========================================
           LOADER
        ========================================= */

        .loader {

            width: 42px;
            height: 42px;

            border:
                4px solid
                rgba(
                    255,
                    255,
                    255,
                    0.20
                );

            border-top-color:
                #ffffff;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {

            .app-title {

                font-size: 29px;

            }


            .profile-image {

                width: 135px;
                height: 135px;

            }


            .profile-name {

                font-size: 23px;

            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =========================================
         LOGIN SCREEN
    ========================================== -->

    <section
        id="loginScreen"
        class="screen active"
    >

        <div class="login-box">


            <h1 class="app-title">
                My App
            </h1>


            <p class="app-subtitle">
                Login to continue
            </p>


            <!-- USERNAME -->

            <div class="input-box">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="button"
                id="loginButton"
                class="login-button"
            >

                LOGIN

            </button>


            <!-- ERROR -->

            <div
                id="errorMessage"
                class="error-message"
                aria-live="polite"
            ></div>


        </div>

    </section>



    <!-- =========================================
         MAIN SCREEN
    ========================================== -->

    <section
        id="mainScreen"
        class="screen"
    >

        <div class="main-content">


            <!--
                FIXED GITHUB PROFILE PICTURE

                GitHub:
                CDT248

                Repository:
                app

                File:
                profile.jpg
            -->

            <img
                id="profileImage"
                class="profile-image"
                src="https://raw.githubusercontent.com/CDT248/app/main/profile.jpg"
                alt="Profile Picture"
            >


            <!--
                NAME WILL COME FROM GOOGLE SHEET
            -->

            <div
                id="profileName"
                class="profile-name"
            >
                User
            </div>


        </div>

    </section>



    <!-- =========================================
         LOADING
    ========================================== -->

    <div
        id="loading"
        class="loading"
    >

        <div class="loader"></div>

    </div>


</div>



<script>

"use strict";


// ======================================================
// GOOGLE APPS SCRIPT URL
// ======================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxqIrcVzanyJkNzwHrH_xMfUxNfqEXKJddBpfirJJclqul_WYfvIBfNcLBkH4OkmP2h/exec";


// ======================================================
// FIXED GITHUB PROFILE PICTURE
// ======================================================

const PROFILE_IMAGE_URL =
"https://raw.githubusercontent.com/CDT248/app/main/profile.jpg";


// ======================================================
// LOCAL STORAGE
// ======================================================

const STORAGE_LOGIN =
"myApp_loggedIn";


const STORAGE_USER =
"myApp_user";


// ======================================================
// GET ELEMENTS
// ======================================================

const loginScreen =
document.getElementById(
    "loginScreen"
);


const mainScreen =
document.getElementById(
    "mainScreen"
);


const usernameInput =
document.getElementById(
    "username"
);


const passwordInput =
document.getElementById(
    "password"
);


const loginButton =
document.getElementById(
    "loginButton"
);


const errorMessage =
document.getElementById(
    "errorMessage"
);


const loading =
document.getElementById(
    "loading"
);


const profileImage =
document.getElementById(
    "profileImage"
);


const profileName =
document.getElementById(
    "profileName"
);


// ======================================================
// LOADING
// ======================================================

function setLoading(
    active
) {

    if (active) {

        loading.classList.add(
            "active"
        );

        loginButton.disabled =
            true;

    }

    else {

        loading.classList.remove(
            "active"
        );

        loginButton.disabled =
            false;

    }

}


// ======================================================
// ERROR
// ======================================================

function showError(
    message
) {

    errorMessage.textContent =
        message || "";

}


function clearError() {

    errorMessage.textContent =
        "";

}


// ======================================================
// SAVE LOGIN SESSION
// ======================================================

function saveSession(
    user
) {

    try {

        localStorage.setItem(
            STORAGE_LOGIN,
            "true"
        );


        localStorage.setItem(
            STORAGE_USER,
            JSON.stringify(
                user
            )
        );

    }

    catch (error) {

        console.error(
            "Session save error:",
            error
        );

    }

}


// ======================================================
// GET SAVED LOGIN
// ======================================================

function getSession() {

    const loggedIn =
        localStorage.getItem(
            STORAGE_LOGIN
        );


    const savedUser =
        localStorage.getItem(
            STORAGE_USER
        );


    if (
        loggedIn !== "true" ||
        !savedUser
    ) {

        return null;

    }


    try {

        return JSON.parse(
            savedUser
        );

    }

    catch (error) {

        clearSession();

        return null;

    }

}


// ======================================================
// CLEAR SESSION
// ======================================================

function clearSession() {

    localStorage.removeItem(
        STORAGE_LOGIN
    );


    localStorage.removeItem(
        STORAGE_USER
    );

}


// ======================================================
// SHOW MAIN PAGE
// ======================================================

function showMain(
    user
) {

    if (!user) {

        return;

    }


    // ==============================================
    // NAME FROM GOOGLE SHEET
    // ==============================================

    const name = String(

        user.name ||

        user.Name ||

        user.username ||

        user.Username ||

        "User"

    ).trim();


    profileName.textContent =
        name;


    // ==============================================
    // GITHUB PROFILE IMAGE
    // ==============================================

    profileImage.src =
        PROFILE_IMAGE_URL;


    // ==============================================
    // CHANGE SCREEN
    // ==============================================

    loginScreen.classList.remove(
        "active"
    );


    mainScreen.classList.add(
        "active"
    );

}


// ======================================================
// LOGIN
// ======================================================

async function login() {

    const username =
        usernameInput.value.trim();


    const password =
        passwordInput.value;


    clearError();


    // ==============================================
    // USERNAME VALIDATION
    // ==============================================

    if (!username) {

        showError(
            "Please enter username."
        );

        usernameInput.focus();

        return;

    }


    // ==============================================
    // PASSWORD VALIDATION
    // ==============================================

    if (!password) {

        showError(
            "Please enter password."
        );

        passwordInput.focus();

        return;

    }


    // ==============================================
    // START LOADING
    // ==============================================

    setLoading(
        true
    );


    try {


        // ==========================================
        // SEND LOGIN REQUEST
        // ==========================================

        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "login",

                            username:
                                username,

                            password:
                                password

                        })

                }
            );


        // ==========================================
        // HTTP CHECK
        // ==========================================

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        // ==========================================
        // GET JSON
        // ==========================================

        const result =
            await response.json();


        console.log(
            "Server response:",
            result
        );


        // ==========================================
        // LOGIN SUCCESS
        // ==========================================

        if (
            result &&
            result.success === true
        ) {


            const user =
                result.user || {};


            // ======================================
            // KEEP USERNAME
            // ======================================

            if (
                !user.username
            ) {

                user.username =
                    username;

            }


            // ======================================
            // SAVE LOGIN
            // ======================================

            saveSession(
                user
            );


            // ======================================
            // OPEN MAIN PAGE
            // ======================================

            showMain(
                user
            );

        }


        // ==========================================
        // LOGIN FAILED
        // ==========================================

        else {

            showError(

                result &&
                result.message

                    ? result.message

                    : "Invalid username or password."

            );

        }

    }

    catch (error) {

        console.error(
            "Login error:",
            error
        );


        showError(
            "Unable to connect to server."
        );

    }

    finally {

        setLoading(
            false
        );

    }

}


// ======================================================
// LOGIN BUTTON
// ======================================================

loginButton.addEventListener(
    "click",
    login
);


// ======================================================
// ENTER KEY - USERNAME
// ======================================================

usernameInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            passwordInput.focus();

        }

    }
);


// ======================================================
// ENTER KEY - PASSWORD
// ======================================================

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            login();

        }

    }
);


// ======================================================
// PROFILE IMAGE ERROR
// ======================================================

profileImage.addEventListener(
    "error",
    function() {

        console.error(
            "Profile picture could not be loaded:",
            PROFILE_IMAGE_URL
        );

    }
);


// ======================================================
// INITIALIZE APP
// ======================================================

function initializeApp() {

    const savedUser =
        getSession();


    // ==============================================
    // ALREADY LOGGED IN
    // ==============================================

    if (savedUser) {

        showMain(
            savedUser
        );

        return;

    }


    // ==============================================
    // SHOW LOGIN
    // ==============================================

    loginScreen.classList.add(
        "active"
    );


    mainScreen.classList.remove(
        "active"
    );


    setTimeout(
        function() {

            usernameInput.focus();

        },
        200
    );

}


// ======================================================
// START APP
// ======================================================

initializeApp();

</script>


</body>

</html>
