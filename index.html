<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#0b0f14">

    <title>My App</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0b0f14;

            color: #ffffff;

            overflow: hidden;
        }


        /* =====================================
           APP
        ===================================== */

        .app {
            width: 100%;
            height: 100vh;

            min-height: 100vh;

            position: relative;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #26313c 0%,
                    #151c24 35%,
                    #0b0f14 75%
                );
        }


        /* =====================================
           SCREEN
        ===================================== */

        .screen {
            width: 100%;
            height: 100%;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        .screen.active {
            display: flex;
        }


        /* =====================================
           LOGIN
        ===================================== */

        .login-box {
            width: 100%;
            max-width: 380px;

            text-align: center;
        }

        .app-title {
            font-size: 32px;

            font-weight: 700;

            margin-bottom: 10px;

            letter-spacing: 0.5px;
        }

        .app-subtitle {
            font-size: 14px;

            color: rgba(255,255,255,0.6);

            margin-bottom: 35px;
        }


        .input-box {
            width: 100%;

            margin-bottom: 15px;
        }

        .input-box input {
            width: 100%;

            height: 54px;

            padding: 0 17px;

            border: 1px solid rgba(255,255,255,0.10);

            border-radius: 14px;

            outline: none;

            background: rgba(255,255,255,0.07);

            color: #ffffff;

            font-size: 15px;

            transition: 0.2s;
        }

        .input-box input::placeholder {
            color: rgba(255,255,255,0.45);
        }

        .input-box input:focus {
            border-color: rgba(255,255,255,0.35);

            background: rgba(255,255,255,0.10);
        }


        .login-button {
            width: 100%;

            height: 54px;

            margin-top: 5px;

            border: none;

            border-radius: 14px;

            background: #ffffff;

            color: #111111;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:active {
            transform: scale(0.98);
        }

        .login-button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        .error-message {
            min-height: 22px;

            margin-top: 15px;

            font-size: 13px;

            color: #ff7d7d;
        }


        /* =====================================
           MAIN PAGE
        ===================================== */

        .main-content {
            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            width: 100%;
        }


        .profile-image {
            width: 150px;

            height: 150px;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid rgba(255,255,255,0.9);

            box-shadow:
                0 0 0 8px rgba(255,255,255,0.06),
                0 20px 55px rgba(0,0,0,0.55);

            background: #202832;
        }


        .profile-name {
            margin-top: 22px;

            font-size: 25px;

            font-weight: 600;

            color: #ffffff;

            letter-spacing: 0.5px;
        }


        /* =====================================
           LOADING
        ===================================== */

        .loading {
            display: none;

            position: fixed;

            inset: 0;

            z-index: 1000;

            align-items: center;

            justify-content: center;

            background: rgba(0,0,0,0.55);

            backdrop-filter: blur(5px);
        }

        .loading.active {
            display: flex;
        }

        .loader {
            width: 42px;

            height: 42px;

            border: 4px solid rgba(255,255,255,0.20);

            border-top-color: #ffffff;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 480px) {

            .screen {
                padding: 20px;
            }

            .app-title {
                font-size: 29px;
            }

            .profile-image {
                width: 135px;

                height: 135px;
            }

            .profile-name {
                font-size: 23px;
            }

        }

    </style>

</head>


<body>

<div class="app">


    <!-- =====================================
         LOGIN SCREEN
    ====================================== -->

    <section
        id="loginScreen"
        class="screen active"
    >

        <div class="login-box">

            <h1 class="app-title">
                My App
            </h1>

            <p class="app-subtitle">
                Login to continue
            </p>


            <div class="input-box">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="username"
                >

            </div>


            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                >

            </div>


            <button
                type="button"
                class="login-button"
                id="loginButton"
            >
                LOGIN
            </button>


            <div
                id="errorMessage"
                class="error-message"
            ></div>

        </div>

    </section>



    <!-- =====================================
         MAIN SCREEN
    ====================================== -->

    <section
        id="mainScreen"
        class="screen"
    >

        <div class="main-content">

            <img
                id="profileImage"
                class="profile-image"
                src="profile.jpg"
                alt="Profile"
            >

            <div
                id="profileName"
                class="profile-name"
            >
                Your Name
            </div>

        </div>

    </section>



    <!-- =====================================
         LOADING
    ====================================== -->

    <div
        id="loading"
        class="loading"
    >

        <div class="loader"></div>

    </div>


</div>



<script>

"use strict";


// ========================================
// GOOGLE APPS SCRIPT API
// ========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxqIrcVzanyJkNzwHrH_xMfUxNfqEXKJddBpfirJJclqul_WYfvIBfNcLBkH4OkmP2h/exec";


// ========================================
// ELEMENTS
// ========================================

const loginScreen =
    document.getElementById("loginScreen");

const mainScreen =
    document.getElementById("mainScreen");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const errorMessage =
    document.getElementById("errorMessage");

const loading =
    document.getElementById("loading");

const profileName =
    document.getElementById("profileName");


// ========================================
// SHOW MAIN
// ========================================

function showMain(user) {

    loginScreen.classList.remove("active");

    mainScreen.classList.add("active");


    if (user && user.name) {

        profileName.textContent =
            user.name;

    }

}


// ========================================
// SHOW LOGIN
// ========================================

function showLogin() {

    mainScreen.classList.remove("active");

    loginScreen.classList.add("active");

}


// ========================================
// LOADING
// ========================================

function setLoading(status) {

    if (status) {

        loading.classList.add("active");

        loginButton.disabled = true;

    } else {

        loading.classList.remove("active");

        loginButton.disabled = false;

    }

}


// ========================================
// ERROR
// ========================================

function showError(message) {

    errorMessage.textContent =
        message || "Login failed.";

}


// ========================================
// SAVE SESSION
// ========================================

function saveSession(user) {

    localStorage.setItem(
        "appLoggedIn",
        "true"
    );

    localStorage.setItem(
        "appUser",
        JSON.stringify(user)
    );

}


// ========================================
// GET SESSION
// ========================================

function getSession() {

    const loggedIn =
        localStorage.getItem("appLoggedIn");

    const user =
        localStorage.getItem("appUser");


    if (
        loggedIn === "true" &&
        user
    ) {

        try {

            return JSON.parse(user);

        } catch (error) {

            localStorage.removeItem("appLoggedIn");

            localStorage.removeItem("appUser");

        }

    }

    return null;

}


// ========================================
// LOGIN
// ========================================

async function login() {

    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;


    errorMessage.textContent = "";


    if (!username) {

        showError(
            "Please enter username."
        );

        usernameInput.focus();

        return;

    }


    if (!password) {

        showError(
            "Please enter password."
        );

        passwordInput.focus();

        return;

    }


    setLoading(true);


    try {

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body: JSON.stringify({

                        action: "login",

                        username: username,

                        password: password

                    })
                }
            );


        const result =
            await response.json();


        if (
            result &&
            result.success === true
        ) {

            saveSession(
                result.user
            );

            showMain(
                result.user
            );

        } else {

            showError(
                result.message ||
                "Invalid username or password."
            );

        }


    } catch (error) {

        console.error(
            "Login Error:",
            error
        );

        showError(
            "Unable to connect to server."
        );

    } finally {

        setLoading(false);

    }

}


// ========================================
// LOGIN BUTTON
// ========================================

loginButton.addEventListener(
    "click",
    login
);


// ========================================
// ENTER KEY
// ========================================

usernameInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            passwordInput.focus();

        }

    }
);


passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            login();

        }

    }
);


// ========================================
// CHECK SAVED LOGIN
// ========================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const session =
            getSession();


        if (session) {

            showMain(
                session
            );

        } else {

            showLogin();

        }

    }
);

</script>

</body>
</html>
