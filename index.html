<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#0b0f14"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <title>My App</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0b0f14;

            color: #ffffff;

            overflow: hidden;

            -webkit-font-smoothing: antialiased;

        }


        /* =========================================
           APP
        ========================================= */

        .app {

            width: 100%;

            height: 100vh;

            min-height: 100vh;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 50% 45%,
                    #26313c 0%,
                    #151c24 35%,
                    #0b0f14 75%
                );

        }


        /* =========================================
           SCREEN
        ========================================= */

        .screen {

            width: 100%;

            height: 100%;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .screen.active {

            display: flex;

        }


        /* =========================================
           LOGIN
        ========================================= */

        .login-box {

            width: 100%;

            max-width: 380px;

            text-align: center;

        }


        .app-title {

            font-size: 32px;

            font-weight: 700;

            color: #ffffff;

            margin-bottom: 10px;

            letter-spacing: 0.5px;

        }


        .app-subtitle {

            font-size: 14px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.60
                );

            margin-bottom: 35px;

        }


        /* =========================================
           INPUT
        ========================================= */

        .input-box {

            width: 100%;

            margin-bottom: 15px;

        }


        .input-box input {

            width: 100%;

            height: 54px;

            padding: 0 17px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            border-radius: 14px;

            outline: none;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.07
                );

            color: #ffffff;

            font-size: 15px;

            transition: 0.2s;

        }


        .input-box input::placeholder {

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.45
                );

        }


        .input-box input:focus {

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-button {

            width: 100%;

            height: 54px;

            margin-top: 5px;

            border: none;

            border-radius: 14px;

            background: #ffffff;

            color: #111111;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;

        }


        .login-button:active {

            transform: scale(0.98);

        }


        .login-button:disabled {

            opacity: 0.50;

            cursor: not-allowed;

        }


        /* =========================================
           ERROR
        ========================================= */

        .error-message {

            min-height: 22px;

            margin-top: 15px;

            font-size: 13px;

            line-height: 1.4;

            color: #ff7070;

        }


        /* =========================================
           MAIN
        ========================================= */

        .main-content {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

        }


        /* =========================================
           PROFILE IMAGE
        ========================================= */

        .profile-image {

            width: 150px;

            height: 150px;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            background: #202832;

            border:
                4px solid
                rgba(
                    255,
                    255,
                    255,
                    0.95
                );

            box-shadow:

                0 0 0 8px
                rgba(
                    255,
                    255,
                    255,
                    0.06
                ),

                0 20px 55px
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );

        }


        /* =========================================
           PROFILE NAME
        ========================================= */

        .profile-name {

            margin-top: 22px;

            font-size: 25px;

            font-weight: 600;

            color: #ffffff;

            letter-spacing: 0.5px;

            text-shadow:
                0 4px 15px
                rgba(
                    0,
                    0,
                    0,
                    0.40
                );

        }


        /* =========================================
           IMAGE LOADING
        ========================================= */

        .profile-image.loading-image {

            opacity: 0.55;

        }


        /* =========================================
           IMAGE NOT FOUND
        ========================================= */

        .profile-image.image-error {

            opacity: 0.40;

        }


        /* =========================================
           LOADING OVERLAY
        ========================================= */

        .loading {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;

            justify-content: center;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );

            backdrop-filter: blur(5px);

            -webkit-backdrop-filter: blur(5px);

        }


        .loading.active {

            display: flex;

        }


        /* =========================================
           LOADER
        ========================================= */

        .loader {

            width: 42px;

            height: 42px;

            border:
                4px solid
                rgba(
                    255,
                    255,
                    255,
                    0.20
                );

            border-top-color: #ffffff;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {

            .screen {

                padding: 20px;

            }


            .app-title {

                font-size: 29px;

            }


            .profile-image {

                width: 135px;

                height: 135px;

            }


            .profile-name {

                font-size: 23px;

            }

        }


        /* =========================================
           SMALL HEIGHT
        ========================================= */

        @media (max-height: 600px) {

            .profile-image {

                width: 115px;

                height: 115px;

            }


            .profile-name {

                margin-top: 16px;

                font-size: 21px;

            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =========================================
         LOGIN SCREEN
    ========================================== -->

    <section
        id="loginScreen"
        class="screen active"
    >

        <div class="login-box">


            <h1 class="app-title">
                My App
            </h1>


            <p class="app-subtitle">
                Login to continue
            </p>


            <!-- USERNAME -->

            <div class="input-box">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                >

            </div>


            <!-- LOGIN -->

            <button
                type="button"
                id="loginButton"
                class="login-button"
            >
                LOGIN
            </button>


            <!-- ERROR -->

            <div
                id="errorMessage"
                class="error-message"
                aria-live="polite"
            ></div>


        </div>

    </section>



    <!-- =========================================
         MAIN SCREEN
    ========================================== -->

    <section
        id="mainScreen"
        class="screen"
    >

        <div class="main-content">


            <!-- PROFILE IMAGE -->

            <img
                id="profileImage"
                class="profile-image"
                alt="Profile Picture"
            >


            <!-- NAME -->

            <div
                id="profileName"
                class="profile-name"
            >
                User
            </div>


        </div>

    </section>



    <!-- =========================================
         LOADING
    ========================================== -->

    <div
        id="loading"
        class="loading"
        aria-hidden="true"
    >

        <div class="loader"></div>

    </div>


</div>



<script>

"use strict";


// ======================================================
// GOOGLE APPS SCRIPT API
// ======================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxqIrcVzanyJkNzwHrH_xMfUxNfqEXKJddBpfirJJclqul_WYfvIBfNcLBkH4OkmP2h/exec";


// ======================================================
// GITHUB CONFIGURATION
// ======================================================
//
// CHANGE ONLY THESE TWO VALUES
//
// Example:
//
// https://github.com/net24bd/MY-AI
//
// Username:
// net24bd
//
// Repository:
// MY-AI
// ======================================================

const GITHUB_USERNAME =
"net24bd";


const GITHUB_REPO =
"MY-AI";


// ======================================================
// GITHUB BRANCH
// ======================================================

const GITHUB_BRANCH =
"main";


// ======================================================
// PROFILE FOLDER
// ======================================================

const PROFILE_FOLDER =
"profile";


// ======================================================
// PROFILE IMAGE EXTENSIONS
// ======================================================
//
// First JPG
// Then JPEG
// Then PNG
// Then WEBP
// ======================================================

const IMAGE_EXTENSIONS = [

    ".jpg",

    ".jpeg",

    ".png",

    ".webp"

];


// ======================================================
// DEFAULT IMAGE
// ======================================================

const DEFAULT_IMAGE =
"";


/*
========================================================
LOCAL STORAGE
========================================================
*/

const STORAGE_LOGIN =
"myApp_loggedIn";


const STORAGE_USER =
"myApp_user";


// ======================================================
// ELEMENTS
// ======================================================

const loginScreen =
document.getElementById(
    "loginScreen"
);


const mainScreen =
document.getElementById(
    "mainScreen"
);


const usernameInput =
document.getElementById(
    "username"
);


const passwordInput =
document.getElementById(
    "password"
);


const loginButton =
document.getElementById(
    "loginButton"
);


const errorMessage =
document.getElementById(
    "errorMessage"
);


const loading =
document.getElementById(
    "loading"
);


const profileImage =
document.getElementById(
    "profileImage"
);


const profileName =
document.getElementById(
    "profileName"
);


// ======================================================
// LOADING CONTROL
// ======================================================

function setLoading(
    active
) {

    if (active) {

        loading.classList.add(
            "active"
        );

        loginButton.disabled =
            true;

    }

    else {

        loading.classList.remove(
            "active"
        );

        loginButton.disabled =
            false;

    }

}


// ======================================================
// ERROR
// ======================================================

function showError(
    message
) {

    errorMessage.textContent =
        message || "";

}


function clearError() {

    errorMessage.textContent =
        "";

}


// ======================================================
// SAVE SESSION
// ======================================================

function saveSession(
    user
) {

    try {

        localStorage.setItem(
            STORAGE_LOGIN,
            "true"
        );


        localStorage.setItem(
            STORAGE_USER,
            JSON.stringify(
                user
            )
        );

    }

    catch (error) {

        console.error(
            "Session save error:",
            error
        );

    }

}


// ======================================================
// GET SESSION
// ======================================================

function getSession() {

    const loggedIn =
        localStorage.getItem(
            STORAGE_LOGIN
        );


    const savedUser =
        localStorage.getItem(
            STORAGE_USER
        );


    if (
        loggedIn !== "true" ||
        !savedUser
    ) {

        return null;

    }


    try {

        return JSON.parse(
            savedUser
        );

    }

    catch (error) {

        clearSession();

        return null;

    }

}


// ======================================================
// CLEAR SESSION
// ======================================================

function clearSession() {

    localStorage.removeItem(
        STORAGE_LOGIN
    );


    localStorage.removeItem(
        STORAGE_USER
    );

}


// ======================================================
// CLEAN USERNAME
// ======================================================

function cleanUsername(
    username
) {

    return String(
        username || ""
    )
    .trim()
    .toLowerCase();

}


// ======================================================
// CREATE GITHUB RAW IMAGE URL
// ======================================================

function createGitHubImageUrl(
    username,
    extension
) {

    const cleanName =
        cleanUsername(
            username
        );


    if (!cleanName) {

        return "";

    }


    return (

        "https://raw.githubusercontent.com/" +

        encodeURIComponent(
            GITHUB_USERNAME
        ) +

        "/" +

        encodeURIComponent(
            GITHUB_REPO
        ) +

        "/" +

        encodeURIComponent(
            GITHUB_BRANCH
        ) +

        "/" +

        PROFILE_FOLDER +

        "/" +

        encodeURIComponent(
            cleanName
        ) +

        extension

    );

}


// ======================================================
// IMAGE URL LIST
// ======================================================

function getProfileImageUrls(
    username
) {

    const urls = [];


    for (
        let i = 0;
        i < IMAGE_EXTENSIONS.length;
        i++
    ) {

        urls.push(

            createGitHubImageUrl(
                username,
                IMAGE_EXTENSIONS[i]
            )

        );

    }


    return urls;

}


// ======================================================
// LOAD PROFILE IMAGE
// ======================================================
//
// Try:
//
// username.jpg
// username.jpeg
// username.png
// username.webp
//
// If one works, stop.
// ======================================================

function loadProfileImage(
    username
) {

    const urls =
        getProfileImageUrls(
            username
        );


    if (
        urls.length === 0
    ) {

        return;

    }


    profileImage.classList.add(
        "loading-image"
    );


    profileImage.classList.remove(
        "image-error"
    );


    let currentIndex =
        0;


    function tryNextImage() {

        if (
            currentIndex >=
            urls.length
        ) {

            profileImage.classList.remove(
                "loading-image"
            );


            profileImage.classList.add(
                "image-error"
            );


            if (DEFAULT_IMAGE) {

                profileImage.src =
                    DEFAULT_IMAGE;

            }


            console.error(
                "No profile image found for:",
                username
            );


            return;

        }


        const imageUrl =
            urls[
                currentIndex
            ];


        currentIndex++;


        const testImage =
            new Image();


        testImage.onload =
            function() {

                profileImage.classList.remove(
                    "loading-image"
                );


                profileImage.classList.remove(
                    "image-error"
                );


                profileImage.src =
                    imageUrl;

            };


        testImage.onerror =
            function() {

                tryNextImage();

            };


        testImage.src =
            imageUrl;

    }


    tryNextImage();

}


// ======================================================
// SHOW PROFILE
// ======================================================

function showProfile(
    user
) {

    if (!user) {

        return;

    }


    // ==============================================
    // USERNAME
    // ==============================================

    const username =
        user.username
            ? String(
                user.username
              ).trim()
            : "";


    // ==============================================
    // NAME
    // ==============================================

    profileName.textContent =
        user.name ||
        username ||
        "User";


    // ==============================================
    // LOAD GITHUB IMAGE
    // ==============================================

    loadProfileImage(
        username
    );


    // ==============================================
    // HIDE LOGIN
    // ==============================================

    loginScreen.classList.remove(
        "active"
    );


    // ==============================================
    // SHOW MAIN
    // ==============================================

    mainScreen.classList.add(
        "active"
    );

}


// ======================================================
// LOGIN
// ======================================================

async function login() {

    const username =
        usernameInput.value.trim();


    const password =
        passwordInput.value;


    clearError();


    // ==============================================
    // USERNAME VALIDATION
    // ==============================================

    if (!username) {

        showError(
            "Please enter username."
        );

        usernameInput.focus();

        return;

    }


    // ==============================================
    // PASSWORD VALIDATION
    // ==============================================

    if (!password) {

        showError(
            "Please enter password."
        );

        passwordInput.focus();

        return;

    }


    // ==============================================
    // START LOADING
    // ==============================================

    setLoading(
        true
    );


    try {

        // ==========================================
        // API REQUEST
        // ==========================================

        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "login",

                            username:
                                username,

                            password:
                                password

                        })

                }
            );


        // ==========================================
        // CHECK RESPONSE
        // ==========================================

        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        // ==========================================
        // GET JSON
        // ==========================================

        const result =
            await response.json();


        console.log(
            "Login Response:",
            result
        );


        // ==========================================
        // LOGIN SUCCESS
        // ==========================================

        if (
            result &&
            result.success === true
        ) {

            const user =
                result.user || {};


            // Ensure username exists

            if (
                !user.username
            ) {

                user.username =
                    username;

            }


            // Save session

            saveSession(
                user
            );


            // Show profile

            showProfile(
                user
            );

        }


        // ==========================================
        // LOGIN FAILED
        // ==========================================

        else {

            showError(

                result &&
                result.message

                    ? result.message

                    : "Invalid username or password."

            );

        }

    }

    catch (error) {

        console.error(
            "Login Error:",
            error
        );


        showError(
            "Unable to connect to server."
        );

    }

    finally {

        setLoading(
            false
        );

    }

}


// ======================================================
// LOGIN BUTTON
// ======================================================

loginButton.addEventListener(
    "click",
    login
);


// ======================================================
// USERNAME ENTER
// ======================================================

usernameInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            passwordInput.focus();

        }

    }
);


// ======================================================
// PASSWORD ENTER
// ======================================================

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            login();

        }

    }
);


// ======================================================
// INITIALIZE APP
// ======================================================

function initializeApp() {

    const savedUser =
        getSession();


    // ==============================================
    // EXISTING SESSION
    // ==============================================

    if (savedUser) {

        showProfile(
            savedUser
        );

        return;

    }


    // ==============================================
    // NEW USER
    // ==============================================

    loginScreen.classList.add(
        "active"
    );


    mainScreen.classList.remove(
        "active"
    );


    usernameInput.focus();

}


// ======================================================
// START APP
// ======================================================

initializeApp();

</script>


</body>

</html>
