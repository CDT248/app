<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#0b0f14"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <title>My App</title>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0b0f14;

            color: #ffffff;

            overflow: hidden;

            -webkit-font-smoothing: antialiased;
        }


        /* =========================================
           APP
        ========================================= */

        .app {

            width: 100%;

            height: 100vh;

            min-height: 100vh;

            position: relative;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 50% 45%,
                    #26313c 0%,
                    #151c24 35%,
                    #0b0f14 75%
                );
        }


        /* =========================================
           SCREEN
        ========================================= */

        .screen {

            width: 100%;

            height: 100%;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 25px;
        }


        .screen.active {

            display: flex;
        }


        /* =========================================
           LOGIN
        ========================================= */

        .login-box {

            width: 100%;

            max-width: 380px;

            text-align: center;
        }


        .app-title {

            font-size: 32px;

            font-weight: 700;

            color: #ffffff;

            margin-bottom: 10px;

            letter-spacing: 0.5px;
        }


        .app-subtitle {

            font-size: 14px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.60
                );

            margin-bottom: 35px;
        }


        /* =========================================
           INPUT
        ========================================= */

        .input-box {

            width: 100%;

            margin-bottom: 15px;
        }


        .input-box input {

            width: 100%;

            height: 54px;

            padding: 0 17px;

            border:

                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            border-radius: 14px;

            outline: none;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.07
                );

            color: #ffffff;

            font-size: 15px;

            transition: 0.2s;
        }


        .input-box input::placeholder {

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.45
                );
        }


        .input-box input:focus {

            border-color:
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );
        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-button {

            width: 100%;

            height: 54px;

            margin-top: 5px;

            border: none;

            border-radius: 14px;

            background: #ffffff;

            color: #111111;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }


        .login-button:active {

            transform: scale(0.98);
        }


        .login-button:disabled {

            opacity: 0.55;

            cursor: not-allowed;
        }


        /* =========================================
           ERROR
        ========================================= */

        .error-message {

            min-height: 22px;

            margin-top: 15px;

            font-size: 13px;

            color: #ff7777;

            line-height: 1.4;
        }


        /* =========================================
           MAIN PAGE
        ========================================= */

        .main-content {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;
        }


        /* =========================================
           PROFILE IMAGE
        ========================================= */

        .profile-image {

            width: 150px;

            height: 150px;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            border:

                4px solid
                rgba(
                    255,
                    255,
                    255,
                    0.95
                );

            background: #202832;

            box-shadow:

                0 0 0 8px
                rgba(
                    255,
                    255,
                    255,
                    0.06
                ),

                0 20px 55px
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );
        }


        /* =========================================
           PROFILE NAME
        ========================================= */

        .profile-name {

            margin-top: 22px;

            font-size: 25px;

            font-weight: 600;

            color: #ffffff;

            letter-spacing: 0.5px;

            text-shadow:

                0 4px 15px
                rgba(
                    0,
                    0,
                    0,
                    0.40
                );
        }


        /* =========================================
           LOADING
        ========================================= */

        .loading {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;

            justify-content: center;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );

            backdrop-filter: blur(5px);

            -webkit-backdrop-filter: blur(5px);
        }


        .loading.active {

            display: flex;
        }


        .loader {

            width: 42px;

            height: 42px;

            border:

                4px solid
                rgba(
                    255,
                    255,
                    255,
                    0.20
                );

            border-top-color: #ffffff;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);
            }
        }


        /* =========================================
           IMAGE ERROR
        ========================================= */

        .profile-image.image-error {

            object-fit: contain;

            padding: 30px;

            opacity: 0.55;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {

            .screen {

                padding: 20px;
            }


            .app-title {

                font-size: 29px;
            }


            .profile-image {

                width: 135px;

                height: 135px;
            }


            .profile-name {

                font-size: 23px;
            }
        }


        /* =========================================
           SMALL HEIGHT DEVICES
        ========================================= */

        @media (max-height: 600px) {

            .profile-image {

                width: 115px;

                height: 115px;
            }


            .profile-name {

                margin-top: 16px;

                font-size: 21px;
            }
        }

    </style>

</head>


<body>


<div class="app">


    <!-- =========================================
         LOGIN SCREEN
    ========================================== -->

    <section
        id="loginScreen"
        class="screen active"
    >

        <div class="login-box">


            <h1 class="app-title">
                My App
            </h1>


            <p class="app-subtitle">
                Login to continue
            </p>


            <!-- USERNAME -->

            <div class="input-box">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                >

            </div>


            <!-- LOGIN -->

            <button
                type="button"
                id="loginButton"
                class="login-button"
            >
                LOGIN
            </button>


            <!-- ERROR -->

            <div
                id="errorMessage"
                class="error-message"
                aria-live="polite"
            ></div>


        </div>

    </section>



    <!-- =========================================
         MAIN SCREEN
    ========================================== -->

    <section
        id="mainScreen"
        class="screen"
    >

        <div class="main-content">


            <!-- PROFILE IMAGE -->

            <img
                id="profileImage"
                class="profile-image"
                src=""
                alt="Profile Picture"
            >


            <!-- NAME -->

            <div
                id="profileName"
                class="profile-name"
            >
                Your Name
            </div>


        </div>

    </section>



    <!-- =========================================
         LOADING
    ========================================== -->

    <div
        id="loading"
        class="loading"
        aria-hidden="true"
    >

        <div class="loader"></div>

    </div>


</div>



<script>

"use strict";


// ======================================================
// GOOGLE APPS SCRIPT API
// ======================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxqIrcVzanyJkNzwHrH_xMfUxNfqEXKJddBpfirJJclqul_WYfvIBfNcLBkH4OkmP2h/exec";


// ======================================================
// LOCAL STORAGE KEYS
// ======================================================

const STORAGE_KEYS = {

    LOGGED_IN:
        "myApp_loggedIn",

    USER:
        "myApp_user"

};


// ======================================================
// ELEMENTS
// ======================================================

const loginScreen =
    document.getElementById(
        "loginScreen"
    );


const mainScreen =
    document.getElementById(
        "mainScreen"
    );


const usernameInput =
    document.getElementById(
        "username"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const loading =
    document.getElementById(
        "loading"
    );


const profileImage =
    document.getElementById(
        "profileImage"
    );


const profileName =
    document.getElementById(
        "profileName"
    );


// ======================================================
// SHOW LOADING
// ======================================================

function setLoading(isLoading) {

    if (isLoading) {

        loading.classList.add(
            "active"
        );

        loginButton.disabled = true;

    } else {

        loading.classList.remove(
            "active"
        );

        loginButton.disabled = false;

    }

}


// ======================================================
// SHOW ERROR
// ======================================================

function showError(message) {

    errorMessage.textContent =
        message || "Login failed.";

}


// ======================================================
// CLEAR ERROR
// ======================================================

function clearError() {

    errorMessage.textContent = "";

}


// ======================================================
// SAVE USER SESSION
// ======================================================

function saveSession(user) {

    localStorage.setItem(
        STORAGE_KEYS.LOGGED_IN,
        "true"
    );


    localStorage.setItem(
        STORAGE_KEYS.USER,
        JSON.stringify(user)
    );

}


// ======================================================
// GET SAVED SESSION
// ======================================================

function getSavedSession() {

    const loggedIn =
        localStorage.getItem(
            STORAGE_KEYS.LOGGED_IN
        );


    const savedUser =
        localStorage.getItem(
            STORAGE_KEYS.USER
        );


    if (
        loggedIn !== "true" ||
        !savedUser
    ) {

        return null;

    }


    try {

        return JSON.parse(
            savedUser
        );

    }

    catch (error) {

        clearSession();

        return null;

    }

}


// ======================================================
// CLEAR SESSION
// ======================================================

function clearSession() {

    localStorage.removeItem(
        STORAGE_KEYS.LOGGED_IN
    );


    localStorage.removeItem(
        STORAGE_KEYS.USER
    );

}


// ======================================================
// CREATE DRIVE IMAGE URL
// ======================================================

function createDriveImageUrl(
    fileId
) {

    if (!fileId) {

        return "";

    }


    return (
        "https://drive.google.com/thumbnail?id=" +
        encodeURIComponent(
            fileId
        ) +
        "&sz=w600"
    );

}


// ======================================================
// SET PROFILE DATA
// ======================================================

function setProfileData(user) {

    if (!user) {

        return;

    }


    // ==============================================
    // NAME
    // ==============================================

    profileName.textContent =
        user.name || "User";


    // ==============================================
    // PHOTO
    // ==============================================

    let photoUrl =
        user.photo || "";


    // If photo URL is missing,
    // create it from File ID.

    if (
        !photoUrl &&
        user.photoFileId
    ) {

        photoUrl =
            createDriveImageUrl(
                user.photoFileId
            );

    }


    // ==============================================
    // SET IMAGE
    // ==============================================

    if (photoUrl) {

        profileImage.classList.remove(
            "image-error"
        );


        profileImage.src =
            photoUrl;

    }

    else {

        profileImage.removeAttribute(
            "src"
        );

    }

}


// ======================================================
// SHOW MAIN PAGE
// ======================================================

function showMainPage(user) {

    setProfileData(
        user
    );


    loginScreen.classList.remove(
        "active"
    );


    mainScreen.classList.add(
        "active"
    );

}


// ======================================================
// SHOW LOGIN PAGE
// ======================================================

function showLoginPage() {

    mainScreen.classList.remove(
        "active"
    );


    loginScreen.classList.add(
        "active"
    );

}


// ======================================================
// PROFILE IMAGE ERROR
// ======================================================

profileImage.addEventListener(
    "error",
    function() {

        this.classList.add(
            "image-error"
        );

    }
);


// ======================================================
// LOGIN
// ======================================================

async function login() {

    const username =
        usernameInput.value.trim();


    const password =
        passwordInput.value;


    clearError();


    // ==============================================
    // VALIDATION
    // ==============================================

    if (!username) {

        showError(
            "Please enter username."
        );

        usernameInput.focus();

        return;

    }


    if (!password) {

        showError(
            "Please enter password."
        );

        passwordInput.focus();

        return;

    }


    // ==============================================
    // LOADING
    // ==============================================

    setLoading(
        true
    );


    try {

        // ==========================================
        // API REQUEST
        // ==========================================

        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "login",

                            username:
                                username,

                            password:
                                password

                        })

                }
            );


        // ==========================================
        // RESPONSE
        // ==========================================

        const result =
            await response.json();


        // ==========================================
        // SUCCESS
        // ==========================================

        if (
            result &&
            result.success === true
        ) {

            const user =
                result.user || {};


            // Save session

            saveSession(
                user
            );


            // Show Main

            showMainPage(
                user
            );


        }

        else {

            showError(

                result &&
                result.message

                    ? result.message

                    : "Invalid username or password."

            );

        }

    }


    catch (error) {

        console.error(
            "Login Error:",
            error
        );


        showError(
            "Unable to connect to server."
        );

    }


    finally {

        setLoading(
            false
        );

    }

}


// ======================================================
// LOGIN BUTTON
// ======================================================

loginButton.addEventListener(
    "click",
    login
);


// ======================================================
// ENTER KEY - USERNAME
// ======================================================

usernameInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            passwordInput.focus();

        }

    }
);


// ======================================================
// ENTER KEY - PASSWORD
// ======================================================

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            login();

        }

    }
);


// ======================================================
// INITIAL APP CHECK
// ======================================================

function initializeApp() {

    const savedUser =
        getSavedSession();


    if (savedUser) {

        showMainPage(
            savedUser
        );

    }

    else {

        showLoginPage();

    }

}


// ======================================================
// START APP
// ======================================================

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initializeApp
    );

}

else {

    initializeApp();

}

</script>


</body>

</html>
