<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#0b0f14"
    >

    <title>My App</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0b0f14;

            color: #ffffff;

            overflow: hidden;

        }


        .app {

            width: 100%;

            height: 100vh;

            min-height: 100vh;

            background:

                radial-gradient(
                    circle at 50% 45%,
                    #26313c 0%,
                    #151c24 35%,
                    #0b0f14 75%
                );

        }


        /* ================================
           SCREEN
        ================================= */

        .screen {

            width: 100%;

            height: 100%;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .screen.active {

            display: flex;

        }


        /* ================================
           LOGIN
        ================================= */

        .login-box {

            width: 100%;

            max-width: 380px;

            text-align: center;

        }


        .app-title {

            font-size: 32px;

            font-weight: 700;

            margin-bottom: 10px;

        }


        .app-subtitle {

            font-size: 14px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.60
                );

            margin-bottom: 35px;

        }


        .input-box {

            width: 100%;

            margin-bottom: 15px;

        }


        .input-box input {

            width: 100%;

            height: 54px;

            padding: 0 17px;

            border:

                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            border-radius: 14px;

            outline: none;

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.07
                );

            color: #ffffff;

            font-size: 15px;

        }


        .input-box input::placeholder {

            color:

                rgba(
                    255,
                    255,
                    255,
                    0.45
                );

        }


        .input-box input:focus {

            border-color:

                rgba(
                    255,
                    255,
                    255,
                    0.35
                );

        }


        /* ================================
           LOGIN BUTTON
        ================================= */

        .login-button {

            width: 100%;

            height: 54px;

            border: none;

            border-radius: 14px;

            background: #ffffff;

            color: #111111;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

        }


        .login-button:active {

            transform: scale(0.98);

        }


        .login-button:disabled {

            opacity: 0.5;

        }


        /* ================================
           ERROR
        ================================= */

        .error-message {

            min-height: 22px;

            margin-top: 15px;

            font-size: 13px;

            color: #ff7070;

        }


        /* ================================
           MAIN
        ================================= */

        .main-content {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

        }


        /* ================================
           PROFILE
        ================================= */

        .profile-image {

            width: 150px;

            height: 150px;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            background: #202832;

            border:

                4px solid
                rgba(
                    255,
                    255,
                    255,
                    0.95
                );

            box-shadow:

                0 0 0 8px
                rgba(
                    255,
                    255,
                    255,
                    0.06
                ),

                0 20px 55px
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );

        }


        .profile-name {

            margin-top: 22px;

            font-size: 25px;

            font-weight: 600;

            color: #ffffff;

        }


        /* ================================
           LOADING
        ================================= */

        .loading {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            align-items: center;

            justify-content: center;

            background:

                rgba(
                    0,
                    0,
                    0,
                    0.55
                );

            backdrop-filter: blur(5px);

        }


        .loading.active {

            display: flex;

        }


        .loader {

            width: 42px;

            height: 42px;

            border:

                4px solid
                rgba(
                    255,
                    255,
                    255,
                    0.20
                );

            border-top-color: #ffffff;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 480px) {

            .app-title {

                font-size: 29px;

            }


            .profile-image {

                width: 135px;

                height: 135px;

            }


            .profile-name {

                font-size: 23px;

            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =================================
         LOGIN SCREEN
    ================================== -->

    <section
        id="loginScreen"
        class="screen active"
    >

        <div class="login-box">


            <h1 class="app-title">
                My App
            </h1>


            <p class="app-subtitle">
                Login to continue
            </p>


            <div class="input-box">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                >

            </div>


            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                >

            </div>


            <button
                type="button"
                id="loginButton"
                class="login-button"
            >
                LOGIN
            </button>


            <div
                id="errorMessage"
                class="error-message"
            ></div>


        </div>

    </section>



    <!-- =================================
         MAIN SCREEN
    ================================== -->

    <section
        id="mainScreen"
        class="screen"
    >

        <div class="main-content">


            <img
                id="profileImage"
                class="profile-image"
                alt="Profile Picture"
            >


            <div
                id="profileName"
                class="profile-name"
            >
                User
            </div>


        </div>

    </section>



    <!-- =================================
         LOADING
    ================================== -->

    <div
        id="loading"
        class="loading"
    >

        <div class="loader"></div>

    </div>


</div>



<script>

"use strict";


// ======================================================
// APPS SCRIPT URL
// ======================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxqIrcVzanyJkNzwHrH_xMfUxNfqEXKJddBpfirJJclqul_WYfvIBfNcLBkH4OkmP2h/exec";


// ======================================================
// STORAGE KEYS
// ======================================================

const LOGGED_IN_KEY =
"myApp_loggedIn";


const USER_KEY =
"myApp_user";


// ======================================================
// ELEMENTS
// ======================================================

const loginScreen =
document.getElementById(
    "loginScreen"
);


const mainScreen =
document.getElementById(
    "mainScreen"
);


const usernameInput =
document.getElementById(
    "username"
);


const passwordInput =
document.getElementById(
    "password"
);


const loginButton =
document.getElementById(
    "loginButton"
);


const errorMessage =
document.getElementById(
    "errorMessage"
);


const loading =
document.getElementById(
    "loading"
);


const profileImage =
document.getElementById(
    "profileImage"
);


const profileName =
document.getElementById(
    "profileName"
);


// ======================================================
// LOADING
// ======================================================

function setLoading(
    active
) {

    if (active) {

        loading.classList.add(
            "active"
        );

        loginButton.disabled =
            true;

    }

    else {

        loading.classList.remove(
            "active"
        );

        loginButton.disabled =
            false;

    }

}


// ======================================================
// ERROR
// ======================================================

function showError(
    message
) {

    errorMessage.textContent =
        message;

}


function clearError() {

    errorMessage.textContent =
        "";

}


// ======================================================
// SAVE SESSION
// ======================================================

function saveSession(
    user
) {

    localStorage.setItem(
        LOGGED_IN_KEY,
        "true"
    );


    localStorage.setItem(
        USER_KEY,
        JSON.stringify(
            user
        )
    );

}


// ======================================================
// GET SESSION
// ======================================================

function getSession() {

    const loggedIn =
        localStorage.getItem(
            LOGGED_IN_KEY
        );


    const savedUser =
        localStorage.getItem(
            USER_KEY
        );


    if (
        loggedIn !== "true" ||
        !savedUser
    ) {

        return null;

    }


    try {

        return JSON.parse(
            savedUser
        );

    }

    catch (error) {

        clearSession();

        return null;

    }

}


// ======================================================
// CLEAR SESSION
// ======================================================

function clearSession() {

    localStorage.removeItem(
        LOGGED_IN_KEY
    );


    localStorage.removeItem(
        USER_KEY
    );

}


// ======================================================
// SHOW PROFILE
// ======================================================

function showProfile(
    user
) {

    if (!user) {

        return;

    }


    // NAME

    profileName.textContent =
        user.name || "User";


    // PHOTO

    const photo =
        user.photo
            ? String(
                user.photo
              ).trim()
            : "";


    if (photo) {

        profileImage.src =
            photo;

        profileImage.style.display =
            "block";

    }

    else {

        profileImage.removeAttribute(
            "src"
        );

    }


    // SHOW MAIN

    loginScreen.classList.remove(
        "active"
    );


    mainScreen.classList.add(
        "active"
    );

}


// ======================================================
// LOGIN
// ======================================================

async function login() {

    const username =
        usernameInput.value.trim();


    const password =
        passwordInput.value;


    clearError();


    // ==============================================
    // VALIDATION
    // ==============================================

    if (!username) {

        showError(
            "Please enter username."
        );

        usernameInput.focus();

        return;

    }


    if (!password) {

        showError(
            "Please enter password."
        );

        passwordInput.focus();

        return;

    }


    setLoading(
        true
    );


    try {

        // ==========================================
        // REQUEST
        // ==========================================

        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "login",

                            username:
                                username,

                            password:
                                password

                        })

                }
            );


        // ==========================================
        // JSON
        // ==========================================

        const result =
            await response.json();


        console.log(
            "API Response:",
            result
        );


        // ==========================================
        // SUCCESS
        // ==========================================

        if (
            result &&
            result.success === true
        ) {

            const user =
                result.user || {};


            saveSession(
                user
            );


            showProfile(
                user
            );

        }


        // ==========================================
        // ERROR
        // ==========================================

        else {

            showError(

                result &&
                result.message

                    ? result.message

                    : "Login failed."

            );

        }

    }


    catch (error) {

        console.error(
            "Login Error:",
            error
        );


        showError(
            "Server connection failed."
        );

    }


    finally {

        setLoading(
            false
        );

    }

}


// ======================================================
// LOGIN BUTTON
// ======================================================

loginButton.addEventListener(
    "click",
    login
);


// ======================================================
// ENTER KEY
// ======================================================

usernameInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            passwordInput.focus();

        }

    }
);


passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            login();

        }

    }
);


// ======================================================
// INITIAL LOAD
// ======================================================

function initialize() {

    const user =
        getSession();


    if (user) {

        showProfile(
            user
        );

    }

    else {

        loginScreen.classList.add(
            "active"
        );

        mainScreen.classList.remove(
            "active"
        );

    }

}


// ======================================================
// START
// ======================================================

initialize();

</script>


</body>

</html>
